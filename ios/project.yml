name: LeTeleop
options:
  bundleIdPrefix: io.github.wayneusc
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
targets:
  LeTeleop:
    type: application
    platform: iOS
    sources:
      - path: LeTeleop
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wayneusc.leteleop
        INFOPLIST_FILE: LeTeleop/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
schemes:
  LeTeleop:
    build:
      targets:
        LeTeleop: all
    run:
      config: Debug
